name: Guard SSL Monitor - Pro

on:
  schedule:
    # 每天 01:00 UTC 执行（北京时间 09:00）
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "任务日期 (YYYY-MM-DD)"
        required: false
        type: string
      dry_run:
        description: "试运行模式"
        required: false
        type: boolean
        default: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Guard SSL Monitor Pro
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: ${{ secrets.BREVO_SENDER_NAME }}
          BRAND_NAME: ${{ vars.BRAND_NAME }}
          BRAND_URL: ${{ vars.BRAND_URL }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: |
          ARGS="--tier pro"

          # 支持 repository_dispatch 和 workflow_dispatch 两种触发方式
          INPUT_DATE="${{ github.event.client_payload.date }}"
          INPUT_DRY_RUN="${{ github.event.client_payload.dry_run }}"

          if [ -z "$INPUT_DATE" ]; then
            INPUT_DATE="${{ github.event.inputs.date }}"
          fi

          if [ -z "$INPUT_DRY_RUN" ]; then
            INPUT_DRY_RUN="${{ github.event.inputs.dry_run }}"
          fi

          if [ -n "$INPUT_DATE" ]; then
            ARGS="$ARGS --date $INPUT_DATE"
          fi

          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          python -m src.main $ARGS
